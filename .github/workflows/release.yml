# Ships the Windows and macOS halves of a tagged release. Pushing a `v*` tag is the only
# trigger, so this never touches a tag already cut: v0.1.0 carries its
# Linux assets alone, exactly as they were published, and stays that way.
#
# The asset is one self-contained exe: the settings program's archive and a
# static Tcl/Tk live inside the terminal binary (`--features
# embedded-settings`), and right-click re-executes that same file with
# `--settings`. There is no second file to co-locate, so the download is
# bare, the shape every other platform's artifact takes.
name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/setup-nasm@v1
      - uses: Swatinem/rust-cache@v2
      # Builds static Tcl/Tk, proves the standalone image, writes the
      # payload zip, and hands the five ROBCO_* variables the cargo build
      # below reads to $GITHUB_ENV.
      - name: build the settings toolchain and payload
        shell: pwsh
        run: ./settings/zipfs/build-selfcontained.ps1 -Embed
      - run: cargo build --release -p robco-app --features embedded-settings
      - name: prove the payload inside the exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath target/release/robco-term.exe `
            -ArgumentList '--settings-selftest' -NoNewWindow -Wait -PassThru `
            -RedirectStandardOutput selftest.txt
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { throw "--settings-selftest exited $($p.ExitCode)" }
          if (-not (Select-String -Path selftest.txt -Pattern 'settings selftest ok' -Quiet)) {
              throw 'selftest output missing its ok line'
          }
      - name: name the exe for the release page
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          $exe = "robco-term-$version-windows-x86_64.exe"
          Copy-Item target/release/robco-term.exe $exe -Force
          "EXE_PATH=$exe" >> $env:GITHUB_ENV
      # docs/release.md's Publish step creates the release in the same
      # breath as the tag push that triggers this job, so the release
      # usually exists by the time the build above finishes; the wait below
      # covers the case where this job wins that race.
      - name: attach the exe to this tag's release, once one exists
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          for ($i = 0; $i -lt 20; $i++) {
              gh release view $tag *> $null
              if ($LASTEXITCODE -eq 0) { break }
              Start-Sleep -Seconds 15
          }
          gh release upload $tag "$env:EXE_PATH" --clobber

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p robco-app
      - name: build the self-contained settings image
        run: BUILD_DIR="$RUNNER_TEMP/robco-settings-build" bash settings/zipfs/build-selfcontained.sh
      # The terminal looks for a fixed `robco-settings` beside its own
      # binary, so the tarball carries that name; the image proves its
      # payload the same way the Windows exe does, before it may ship.
      - name: prove the image and stage the pair
        run: |
          image=$(ls settings/dist/robco-settings-*-macos-* | head -1)
          test -n "$image"
          "$image" --selftest | tee selftest.txt
          grep -q 'settings selftest ok' selftest.txt
          mkdir stage
          cp target/release/robco-term stage/robco-term
          cp "$image" stage/robco-settings
      - name: tar the pair for the release page
        run: |
          version="${GITHUB_REF_NAME#v}"
          tarball="robco-term-$version-macos-arm64.tar.gz"
          tar -C stage -czf "$tarball" robco-term robco-settings
          echo "TAR_PATH=$tarball" >> "$GITHUB_ENV"
      - name: attach the tarball to this tag's release, once one exists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in $(seq 1 20); do
              gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && break
              sleep 15
          done
          gh release upload "$GITHUB_REF_NAME" "$TAR_PATH" --clobber
