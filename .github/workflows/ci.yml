# The proofs this repository cannot make locally, both about Windows. The
# terminal compiles there (the C++ terminal-core dependency needs a native
# toolchain, so no Linux box can check it), and glyph fallback finds a face
# there for a character the bundled font has no glyph for. That second one
# is behaviour rather than compilation: the fallback list, the font families
# it names and the directories the font database reads are all different on
# Windows, so a build that succeeds says nothing about whether a character
# outside ASCII reaches the glass. Shaping needs no GPU and no window, so
# those tests run anywhere. The rest of the suite runs on the development
# machines before every push.
name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # ring's build assembles its MSVC objects with nasm.
      - uses: ilammy/setup-nasm@v1
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p robco-app
      - run: cargo test --release -p robco-term --test suite fallback
      # The runner is this project's only Windows build machine, so what it
      # builds is the product, kept, not a proof discarded: every green run
      # carries an exe a tester can download and launch.
      - uses: actions/upload-artifact@v4
        with:
          name: robco-term-windows-x86_64
          path: target/release/robco-term.exe
