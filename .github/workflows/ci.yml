# One proof, the one this repository cannot make locally: the terminal
# compiles for Windows (the C++ terminal-core dependency needs a native
# toolchain, so no Linux box can check this). Nothing else runs here; the
# test suite runs on the development machines before every push.
name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # ring's build assembles its MSVC objects with nasm.
      - uses: ilammy/setup-nasm@v1
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p robco-app
