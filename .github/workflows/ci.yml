# The proofs this repository cannot make locally, both about Windows. The
# terminal compiles there (the C++ terminal-core dependency needs a native
# toolchain, so no Linux box can check it), and glyph fallback finds a face
# there for a character the bundled font has no glyph for. That second one
# is behaviour rather than compilation: the fallback list, the font families
# it names and the directories the font database reads are all different on
# Windows, so a build that succeeds says nothing about whether a character
# outside ASCII reaches the glass. Shaping needs no GPU and no window, so
# those tests run anywhere. The rest of the suite runs on the development
# machines before every push.
name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # ring's build assembles its MSVC objects with nasm.
      - uses: ilammy/setup-nasm@v1
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p robco-app
      - run: cargo test --release -p robco-term --test suite fallback
      # The runner is this project's only Windows build machine, so what it
      # builds is the product, kept, not a proof discarded: every green run
      # carries an exe a tester can download and launch.
      - uses: actions/upload-artifact@v4
        with:
          name: robco-term-windows-x86_64
          path: target/release/robco-term.exe

  # A parallel job, not a step tacked onto `windows`: the settings image is
  # a separate toolchain (MSVC + nmake against a from-source Tcl/Tk, no
  # Rust at all) with its own way to fail, and folding it into `windows`
  # would let a settings-build break hide behind a green terminal build.
  # This is also the first time build-selfcontained.ps1 has run anywhere;
  # a green run here is the first proof its Windows twin of
  # build-selfcontained.sh actually works, not just reads plausibly.
  settings-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: build the self-contained settings image
        shell: pwsh
        run: ./settings/zipfs/build-selfcontained.ps1
      # build.tcl names the image robco-settings-<version>-windows-<arch>.exe
      # (settings/dist/, the version stamped from settings/robco-settings);
      # the terminal looks for a fixed `robco-settings.exe` beside itself
      # (crates/app/src/window.rs, SETTINGS_BINARY), so the artifact carries
      # that name instead.
      - name: name the image robco-settings.exe, the name the terminal looks for
        shell: pwsh
        run: |
          $built = Get-ChildItem -Path settings/dist -Filter 'robco-settings-*.exe' | Select-Object -First 1
          if (-not $built) { throw 'no robco-settings-*.exe produced under settings/dist' }
          Copy-Item $built.FullName 'settings/dist/robco-settings.exe' -Force
      - uses: actions/upload-artifact@v4
        with:
          name: robco-settings-windows-x86_64
          path: settings/dist/robco-settings.exe
