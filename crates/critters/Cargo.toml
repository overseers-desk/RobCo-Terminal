[package]
name = "robco-critters"
version = "0.1.0"
edition = "2021"
rust-version = "1.96.1"
description = "The critters: eight pieces of drawn ASCII art, a memoryless clock that sends one across the glass every quarter hour or so, and the cells it asks to have painted. No renderer, no terminal, no clock of its own."
license = "MIT"
publish = false

[lib]
name = "critters"
path = "src/lib.rs"

# No dependencies, and the same reason `tmux-cc` has none: what this crate
# does is arithmetic on a clock the caller owns. The generator it needs is
# twenty lines in `rng`.
[dependencies]
