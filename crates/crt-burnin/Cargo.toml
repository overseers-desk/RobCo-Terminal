[package]
name = "robco-crt-burnin"
version = "0.1.0"
edition = "2021"
rust-version = "1.96.1"
description = "RobCo Terminal burn-in: the librashader feedback pass that ages a lit pixel's ghost after it goes dark, its wall-clock decay clock, and the mount contract a host filter graph honours."
license = "MIT"
publish = false

[lib]
name = "crt_burnin"
path = "src/lib.rs"

[features]
# The decay arithmetic and the mount contract are pure CPU and pull nothing; a
# host that only wants those can turn the runtime off. On by default because the
# pass is the point of the crate.
default = ["wgpu-runtime"]
wgpu-runtime = ["dep:librashader", "dep:wgpu", "dep:pollster"]

[dependencies]
# Exactly the S1 pins. librashader 0.12 links wgpu 30.0.0 and hands us its
# types, so a different wgpu here is a different, incompatible `Device`.
librashader = { version = "=0.12.0", default-features = false, features = [
    "runtime-wgpu",
    "presets",
    "preprocess",
], optional = true }
wgpu = { version = "=30.0.0", optional = true }
pollster = { version = "0.4", optional = true }
